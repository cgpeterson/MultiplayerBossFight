<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Duel 3D - Multiplayer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="game-container">
        <div id="menu" class="overlay">
            <h1>Shadow Duel 3D</h1>
            <div class="input-group">
                <input type="text" id="playerNameInput" placeholder="Your Name" maxlength="12" value="">
                <input type="text" id="bossNameInput" placeholder="Boss Name (shared session)" maxlength="20" value="Sword Saint">
                <select id="mapSelect">
                    <option value="arena">Map: Dark Arena</option>
                    <option value="snow">Map: Snowy Forest</option>
                    <option value="meadow">Map: Green Meadow</option>
                </select>
                <button id="startBtn">ENTER ARENA</button>
                <div class="status-text" id="statusText"></div>
            </div>
            <div class="controls">
                <p><span class="key">WASD / L-STICK</span> Move &nbsp; <span class="key">SPACE / A</span> Dash &nbsp; <span class="key">E / Y</span> Heal</p>
                <p><span class="key">L-CLICK / X / RB</span> Attack (hold for heavy) &nbsp; <span class="key">R-CLICK / LB</span> Deflect</p>
            </div>
        </div>

        <div id="hud">
            <div class="boss-hud">
                <div class="boss-name" id="hudBossName">Boss Name</div>
                <div class="bar-container">
                    <div class="health-bar" id="bossHealth"></div>
                </div>
                <div class="posture-bar" id="bossPosture"></div>
            </div>

            <div class="player-hud">
                <div class="boss-name" style="font-size: 1.1rem; color: #aaa;" id="localPlayerName">Wolf</div>
                <div class="bar-container">
                    <div class="health-bar" style="background: #ccc;" id="playerHealth"></div>
                </div>
                <div class="posture-bar" id="playerPosture"></div>
                <div class="stamina-bar" id="playerStamina"></div>
            </div>

            <div class="player-count" id="playerCount">Players: 1</div>

            <div class="ally-huds" id="allyHuds"></div>

            <div class="item-counter">
                <div class="flask-icon"></div>
                <span id="flaskCount">3</span>
            </div>

            <div id="kanji" class="kanji-flash">危</div>
        </div>

        <div id="endScreen" class="overlay hidden">
            <div id="endText" class="death-text">DEATH</div>
            <button id="resurrectBtn" style="margin-top: 50px;">Resurrect</button>
        </div>
    </div>

    <script src="gameLogic.js"></script>
    <script src="game.js"></script>
</body>
</html>
